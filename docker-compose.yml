services:
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # Required: the stack refuses to start without an encryption key and API key.
      TOKEN_VAULT_KEY: ${TOKEN_VAULT_KEY:?TOKEN_VAULT_KEY is required}
      SECUREDOC_API_KEY: ${SECUREDOC_API_KEY:?SECUREDOC_API_KEY is required}
      JAVA_VALIDATOR_URL: http://java-validator:8080
      DATABASE_URL: sqlite:///./data/securedoc.db
      AUDIT_LOG_PATH: ./data/audit.log
    volumes:
      - securedoc_data:/app/data
    depends_on:
      java-validator:
        condition: service_healthy
    ports:
      # Bound to localhost for debugging; the browser reaches the API via nginx.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  java-validator:
    build: ./java-validator
    environment:
      MAX_FILE_SIZE_BYTES: ${MAX_UPLOAD_SIZE_MB:-5}000000
    ports:
      # Localhost only; the backend reaches the validator over the compose network.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      # Injected by the nginx template at request time; never built into the SPA.
      SECUREDOC_API_KEY: ${SECUREDOC_API_KEY:?SECUREDOC_API_KEY is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  securedoc_data:
