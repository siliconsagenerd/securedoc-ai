<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureDoc AI architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --color-rule: #bfc0c0;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>SecureDoc AI request flow</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secure-doc-architecture-title secure-doc-architecture-desc">
        <title id="secure-doc-architecture-title">SecureDoc AI request flow</title>
        <desc id="secure-doc-architecture-desc">A Vue dashboard sends documents through an nginx proxy to a FastAPI backend, which validates, guards, redacts, calls Gemini, and writes an audit log.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows -->
        <line x1="200" y1="230" x2="250" y2="230" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="380" y1="230" x2="430" y2="230" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <line x1="495" y1="200" x2="495" y2="110" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 560 230 L 560 110 L 970 110" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="560" y1="230" x2="610" y2="230" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <line x1="740" y1="230" x2="790" y2="230" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="855" y1="260" x2="855" y2="340" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 790 370 L 750 370 L 750 420 L 430 420 L 430 260" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 560 200 L 560 150 L 970 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 430 260 L 430 430 L 80 430 L 80 260" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="205" y="218" width="40" height="16" fill="#f5f5f5"/>
        <text x="225" y="230" font-family="Geist Mono, ui-monospace, monospace" font-size="8" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">API</text>

        <rect x="748" y="182" width="54" height="16" fill="#f5f5f5"/>
        <text x="775" y="190" font-family="Geist Mono, ui-monospace, monospace" font-size="8" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">BLOCKED</text>

        <rect x="752" y="218" width="50" height="16" fill="#f5f5f5"/>
        <text x="777" y="226" font-family="Geist Mono, ui-monospace, monospace" font-size="8" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">ALLOWED</text>

        <rect x="748" y="138" width="60" height="16" fill="#f5f5f5"/>
        <text x="778" y="146" font-family="Geist Mono, ui-monospace, monospace" font-size="8" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">AUDIT</text>

        <!-- Nodes -->
        <rect x="70" y="200" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="78" y="204" width="34" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="95" y="211" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">CLIENT</text>
        <text x="135" y="230" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Vue dashboard</text>

        <rect x="250" y="200" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="258" y="204" width="30" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="273" y="211" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">EDGE</text>
        <text x="315" y="230" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">nginx proxy</text>

        <rect x="430" y="200" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="438" y="204" width="42" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="459" y="211" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">BACKEND</text>
        <text x="495" y="230" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">FastAPI</text>

        <rect x="430" y="50" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="438" y="54" width="40" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="458" y="61" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">VALIDATE</text>
        <text x="495" y="80" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Java validator</text>

        <rect x="610" y="200" width="130" height="60" rx="6" fill="#ececec" stroke="#bf4520" stroke-width="2"/>
        <rect x="618" y="204" width="34" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="635" y="211" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">GUARD</text>
        <text x="675" y="230" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Injection guard</text>

        <rect x="790" y="200" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="798" y="204" width="38" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="817" y="211" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">REDACT</text>
        <text x="855" y="230" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Presidio vault</text>

        <rect x="790" y="340" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="798" y="344" width="34" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="815" y="351" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">MODEL</text>
        <text x="855" y="370" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Gemini API</text>

        <rect x="970" y="100" width="130" height="60" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.5"/>
        <rect x="978" y="104" width="36" height="14" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="996" y="111" font-family="Geist Mono, ui-monospace, monospace" font-size="7" fill="#5a6580" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.14em">AUDIT</text>
        <text x="1035" y="130" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" dominant-baseline="middle">Audit log</text>
      </svg>
    </div>
  </div>
</body>
</html>
